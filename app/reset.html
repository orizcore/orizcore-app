<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Réinitialiser mon mot de passe — Orizcore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:linear-gradient(160deg,#0B1437 0%,#162057 60%,#2563EB 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;}
  .card{background:#fff;border-radius:20px;padding:36px 28px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
  .logo{text-align:center;margin-bottom:28px;}
  .logo img{width:140px;}
  h1{font-size:18px;font-weight:700;color:#0F172A;margin-bottom:6px;}
  p.sub{font-size:13px;color:#64748B;margin-bottom:24px;line-height:1.5;}
  label{font-size:11px;font-weight:700;color:#6B7280;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.7px;}
  .field{margin-bottom:16px;}
  .input-wrap{position:relative;}
  input{width:100%;padding:12px 44px 12px 14px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:15px;color:#0F172A;background:#F8FAFC;font-family:inherit;transition:border-color 0.15s;outline:none;}
  input:focus{border-color:#2563EB;}
  .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#94A3B8;display:flex;align-items:center;padding:0;}
  .btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#D4A017,#b8860b);color:#fff;font-weight:700;font-size:15px;cursor:pointer;transition:opacity 0.2s;font-family:inherit;margin-top:4px;}
  .btn:hover{opacity:0.9;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .err{background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:10px 14px;font-size:13px;color:#B91C1C;margin-bottom:14px;}
  .success{text-align:center;display:none;}
  .success .icon{font-size:52px;margin-bottom:12px;}
  .success h2{font-size:20px;font-weight:800;color:#0F172A;margin-bottom:8px;}
  .success p{font-size:13px;color:#64748B;line-height:1.6;margin-bottom:20px;}
  .link{color:#2563EB;font-size:13px;font-weight:600;text-decoration:none;display:block;text-align:center;margin-top:14px;}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <img src="https://app.orizcore.com/icons/apple-touch-icon.png" alt="Orizcore" onerror="this.style.display='none'"/>
    <div style="font-family:'Inter',sans-serif;font-size:22px;font-weight:800;color:#0B1437;letter-spacing:1px;margin-top:4px;">ORIZCORE</div>
  </div>

  <div id="formSection">
    <h1>🔐 Nouveau mot de passe</h1>
    <p class="sub">Choisis un nouveau mot de passe sécurisé pour ton compte Orizcore.</p>

    <div id="errBox" class="err" style="display:none;"></div>

    <div class="field">
      <label>Nouveau mot de passe</label>
      <div class="input-wrap">
        <input type="password" id="pwd1" placeholder="Min. 6 caractères" autocomplete="new-password"/>
        <button class="eye" onclick="toggle('pwd1',this)" type="button">
          <svg id="eye1" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label>Confirmer le mot de passe</label>
      <div class="input-wrap">
        <input type="password" id="pwd2" placeholder="Répète le mot de passe" autocomplete="new-password"/>
      </div>
    </div>

    <button class="btn" id="submitBtn" onclick="submit()">Enregistrer le nouveau mot de passe</button>
    <a href="https://app.orizcore.com" class="link">← Retour à la connexion</a>
  </div>

  <div class="success" id="successSection">
    <div class="icon">✅</div>
    <h2>Mot de passe modifié !</h2>
    <p>Ton mot de passe a bien été mis à jour. Tu peux maintenant te connecter avec ton nouveau mot de passe.</p>
    <a href="https://app.orizcore.com" style="display:inline-block;background:linear-gradient(135deg,#2563EB,#0B1437);color:#fff;padding:13px 26px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none;">Se connecter →</a>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://xfgaczxvnbtohbgrqcsi.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmZ2Fjenh2bmJ0b2hiZ3JxY3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NDkzMTUsImV4cCI6MjA5NTAyNTMxNX0.uIOXJS_Yjhi-t596pRonwLUnqN8ea3n0f2xt8IQmh0g';

// Initialiser Supabase avec le token de la session de reset
const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// Récupérer la session depuis le hash de l'URL (Supabase envoie #access_token=...)
window.addEventListener('load', async () => {
  const hash = window.location.hash;
  if (!hash || !hash.includes('access_token')) {
    showErr("Lien invalide ou expiré. Demande un nouveau lien de réinitialisation.");
    document.getElementById('submitBtn').disabled = true;
  }
});

function toggle(inputId, btn) {
  const input = document.getElementById(inputId);
  const isText = input.type === 'text';
  input.type = isText ? 'password' : 'text';
  btn.innerHTML = isText
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
}

function showErr(msg) {
  const box = document.getElementById('errBox');
  box.textContent = '⚠️ ' + msg;
  box.style.display = 'block';
}

async function submit() {
  const pwd1 = document.getElementById('pwd1').value;
  const pwd2 = document.getElementById('pwd2').value;
  document.getElementById('errBox').style.display = 'none';

  if (!pwd1 || !pwd2) { showErr('Remplis les deux champs.'); return; }
  if (pwd1.length < 6) { showErr('Minimum 6 caractères.'); return; }
  if (pwd1 !== pwd2) { showErr('Les mots de passe ne correspondent pas.'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';

  const { error } = await sb.auth.updateUser({ password: pwd1 });

  if (error) {
    showErr(error.message);
    btn.disabled = false;
    btn.textContent = 'Enregistrer le nouveau mot de passe';
    return;
  }

  document.getElementById('formSection').style.display = 'none';
  document.getElementById('successSection').style.display = 'block';
  await sb.auth.signOut();
}
</script>
</body>
</html>
